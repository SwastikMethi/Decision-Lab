name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: .venv/bin/ruff check backend scripts
      - run: .venv/bin/ruff format --check backend scripts
      - run: .venv/bin/mypy backend/decisionlab
      - run: .venv/bin/python -m pytest -q
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: .venv/bin/decisionlab openapi
      - run: npm run types:api
      - run: git diff --exit-code -- docs/openapi.json frontend/src/api-schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
